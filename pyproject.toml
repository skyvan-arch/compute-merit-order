[project]
name = "compute-merit-order"
version = "0.1.0"
description = "Open, reproducible dataset and research on where AI compute is economic to run, and what binds first: chips or power."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "pydantic>=2.7",
    "matplotlib>=3.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
us-power = [
    "gridstatus>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-requests>=2.32",
    "types-python-dateutil>=2.9",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# config/ is a placeholder for later phases (see backlog issues) and will be
# added here once it has real code, to avoid empty-package build quirks.
packages = ["pipelines", "models", "figures"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pipelines", "models", "config", "tests", "figures"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # prefer pathlib
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pipelines", "models", "config"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipelines", "models", "config", "tests", "figures"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.coverage.run]
source = ["pipelines", "models", "config"]
